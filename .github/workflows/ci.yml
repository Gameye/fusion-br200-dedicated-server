name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # The entrypoint contract test needs a built server image, so CI runs the packaging guard only.
      - run: node --test tests/build-artifact-contract.test.mjs
      - run: shellcheck --severity=warning scripts/*.sh docker/entrypoint.sh
